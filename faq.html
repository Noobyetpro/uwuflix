<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FAQ</title>
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <section class="faq-hero">
    <h1>❓ Frequently Asked Questions</h1>
    <p>Answers to the questions you never knew you had.</p>
  </section>

  <section class="faq-section">
    <div class="faq-item">
      <input type="checkbox" id="faq1" />
      <label for="faq1" class="faq-question">Why is the site so dark and dramatic?</label>
      <div class="faq-answer">
        <p>Its also pink btw 🥵</p>
      </div>
    </div>

    <div class="faq-item">
      <input type="checkbox" id="faq2" />
      <label for="faq2" class="faq-question">Do you actually use cookies?</label>
      <div class="faq-answer">
        <p>They can be used as adult toys.</p>
      </div>
    </div>

    <div class="faq-item">
      <input type="checkbox" id="faq3" />
      <label for="faq3" class="faq-question">How 2 contact support</label>
      <div class="faq-answer">
        <p>email insane</p>
      </div>
    </div>

    <div class="faq-item">
      <input type="checkbox" id="faq4" />
      <label for="faq4" class="faq-question">Why is everything so funny here?</label>
      <div class="faq-answer">
        <p>Because it is</p>
      </div>
    </div>

    <div class="faq-item">
      <input type="checkbox" id="faq5" />
      <label for="faq5" class="faq-question">Can I work here?</label>
      <div class="faq-answer">
        <p>Yes but u have to pay to work here</p>
      </div>
    </div>
  </section>

  <footer style="text-align:center; padding:40px; color:#FDEBD0; opacity:0.7;">
    made by noobyetpro >:)
  </footer>
</body>
</html>
